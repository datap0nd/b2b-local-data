name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download locked local dependencies
        run: python scripts/vendor_dependencies.py
      - name: Start disposable runner PostgreSQL
        shell: pwsh
        run: |
          Set-Service postgresql-x64-14 -StartupType Manual
          Start-Service postgresql-x64-14
      - name: Test rules, API, and live PostgreSQL parity
        env:
          B2B_TEST_PGURL: 127.0.0.1:5432/postgres
          B2B_TEST_PGUSER: postgres
          B2B_TEST_PGPASSWORD: root # Default password of the disposable hosted runner, not application credentials.
        run: python run.py --self-test
      - name: Portable installation smoke test
        env:
          DG_GITHUB_TOKEN: ${{ github.token }}
        shell: pwsh
        run: .\tests\portable_install.ps1
  frontend:
    # Use the same Windows ABI as the locked portable backend for browser integration.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Committed compiled assets match their source
        working-directory: frontend
        run: npm run verify
      - name: Frontend type check
        working-directory: frontend
        run: npm run typecheck
      - name: Frontend unit tests
        working-directory: frontend
        run: npm test
      - name: Production frontend build
        working-directory: frontend
        run: npm run build
      - name: Install locked backend dependencies
        run: python scripts/vendor_dependencies.py
      - name: Install browser
        working-directory: frontend
        run: npx playwright install chromium
      - name: Start isolated fictional-data backend
        shell: pwsh
        env:
          DB_KIND: demo
          B2B_ENABLE_ACCEPTANCE_UI: 'true'
          B2B_ALLOW_LOCALHOST_IDENTITY: 'false'
        run: |
          $demoHome = Join-Path $env:RUNNER_TEMP 'b2b-browser-tests'
          New-Item -ItemType Directory -Force -Path $demoHome | Out-Null
          Start-Process -FilePath (Get-Command python).Source -ArgumentList @('run.py', '--home', $demoHome) -WindowStyle Hidden -RedirectStandardOutput (Join-Path $demoHome 'server.log') -RedirectStandardError (Join-Path $demoHome 'server-error.log')
          $ready = $false
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            try { Invoke-WebRequest 'http://127.0.0.1:8765/api/bootstrap' -UseBasicParsing | Out-Null; $ready = $true; break } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $ready) { Get-Content (Join-Path $demoHome 'server-error.log'); throw 'Demo backend did not start.' }
      - name: Browser regression and synthetic acceptance checks
        working-directory: frontend
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: frontend/test-results
          retention-days: 7
